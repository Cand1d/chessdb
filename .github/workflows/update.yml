name: Update Dashboard
on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas plotly
      # A failure in one dashboard must not stop the other from publishing, so
      # both builds run, the commit goes out, and the job is failed afterwards.
      - id: chess
        run: python chess.py
        continue-on-error: true
      - id: compounder
        run: python compounder.py
        continue-on-error: true
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html trading.html
          git commit -m "Update dashboard" || echo "No changes"
          git push
      - if: steps.chess.outcome == 'failure' || steps.compounder.outcome == 'failure'
        run: |
          echo "chess.py: ${{ steps.chess.outcome }}"
          echo "compounder.py: ${{ steps.compounder.outcome }}"
          echo "A dashboard build failed; the published page is stale." >&2
          exit 1
